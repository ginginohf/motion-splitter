name: Windows installer acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: choco install innosetup --no-progress -y
      - run: python tools/prepare_windows_vendor.py
      - name: Build and test frozen application
        shell: pwsh
        run: python tools/build_installer.py --vendor build/vendor-windows --version 0.18.1 --development --iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - name: Test installer and installed app
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/windows-x64-development/*.exe | Select-Object -First 1
          $target = "$env:RUNNER_TEMP\MotionSplitter"
          $p = Start-Process $installer.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installation failed' }
          $p = Start-Process "$target\MotionSplitter.exe" -ArgumentList '--self-test',"$env:RUNNER_TEMP\installed-test.json",'--gui' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installed app failed' }
          $report = Get-Content "$env:RUNNER_TEMP\installed-test.json" | ConvertFrom-Json
          if ($report.status -ne 'passed') { throw 'Self-test failed' }
          Copy-Item "$env:RUNNER_TEMP\installed-test.json" dist/windows-x64-development/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer-development
          path: |
            dist/windows-x64-development/*.exe
            dist/windows-x64-development/*.json
            dist/windows-x64-development/SHA256SUMS
          retention-days: 7
