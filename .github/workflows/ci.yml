name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-2022
            python: '3.12'
          - os: macos-15
            python: '3.12'
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install FFprobe and GUI libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb xauth python3-tk libgl1 libglib2.0-0
      - name: Install FFprobe (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg actionlint
      - name: Install FFprobe (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Validate GitHub Actions workflow
        if: runner.os == 'macOS'
        run: actionlint .github/workflows/ci.yml
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Core and media checks
        run: python tools/check_ci.py
      - name: Tk checks with virtual display (Linux)
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: xvfb-run -a -s '-screen 0 1600x1200x24' python tools/check_ci.py --gui-only
      - name: Tk checks (Windows and macOS)
        if: runner.os != 'Linux'
        run: python tools/check_ci.py --gui-only
      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checks-${{ matrix.os }}-py${{ matrix.python }}
          path: tests/ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
